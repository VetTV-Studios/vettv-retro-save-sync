
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  linux-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller "PySide6-Essentials>=6.8,<6.9"
          pip install -e .
      - name: PyInstaller
        run: pyinstaller packaging/retro-save-sync.spec
      - name: Wrap AppImage
        run: |
          set -e
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/RetroSaveSync AppDir/usr/bin/retro-save-sync
          cat > AppDir/usr/share/applications/retro-save-sync.desktop << 'DESK'
          [Desktop Entry]
          Type=Application
          Name=VetTV Retro Save Sync
          Exec=retro-save-sync gui
          Icon=retro-save-sync
          Categories=Utility;Game;
          DESK
          cp AppDir/usr/share/applications/retro-save-sync.desktop AppDir/
          # A generated icon can be added later; appimagetool will still wrap the binary.
          curl -sL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
          ./appimagetool AppDir RetroSaveSync-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: RetroSaveSync-x86_64.AppImage

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller "PySide6-Essentials>=6.8,<6.9"
          pip install -e .
      - name: PyInstaller
        run: pyinstaller packaging/retro-save-sync.spec
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/RetroSaveSync.exe
