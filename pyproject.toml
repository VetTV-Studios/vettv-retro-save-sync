[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retro-save-sync"
version = "0.1.0"
description = "VetTV Retro Save Sync — safe, reversible save sync for RetroArch, PCSX2, Dolphin, and custom paths."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "VetTV Studios" }]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.8"]
dev = ["pytest>=8"]

[project.scripts]
retro-save-sync = "retro_save_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
